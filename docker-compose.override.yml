# docker-compose.override.yml — LOCAL DEVELOPMENT extras.
#
# Docker Compose auto-loads this file on plain `docker compose up` (no -f
# flags). The EC2 path uses explicit `-f docker-compose.yml -f
# docker-compose.prod.yml`, which does NOT pick this up — so these
# conveniences never reach a server.
#
# Right now it only publishes the Postgres port on localhost so you can point
# psql / a GUI at it while developing.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
