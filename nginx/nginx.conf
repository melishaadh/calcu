worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream scientific_upstream {
        server scientific-engine:5001;
    }

    upstream financial_upstream {
        server financial-engine:5002;
    }

    upstream history_upstream {
        server history-service:5003;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        location /api/scientific {
            proxy_pass http://scientific_upstream/api/scientific;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/financial {
            proxy_pass http://financial_upstream/api/financial;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/history {
            proxy_pass http://history_upstream/api/history;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
