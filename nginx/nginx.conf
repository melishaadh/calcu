worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream scientific_upstream {
        server scientific-engine:5001;
    }

    upstream financial_upstream {
        server financial-engine:5002;
    }

    upstream history_upstream {
        server history-service:5003;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # Serve JSON instead of nginx's default HTML error pages, so a dead/
        # unready upstream pod (502/503/504) or a bad path (404) still gives
        # the frontend something JSON.parse() can handle - instead of
        # crashing with "unexpected character at line 1 column 1".
        error_page 404 = @json_404;
        error_page 500 502 503 504 = @json_5xx;

        location @json_404 {
            default_type application/json;
            return 404 '{"error": "Not found"}';
        }

        location @json_5xx {
            default_type application/json;
            return 502 '{"error": "Upstream service unavailable"}';
        }

        location /api/scientific {
            proxy_pass http://scientific_upstream/api/scientific;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/financial {
            proxy_pass http://financial_upstream/api/financial;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/history {
            proxy_pass http://history_upstream/api/history;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
