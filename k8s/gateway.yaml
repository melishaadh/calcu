# gateway.yaml
#
# THE FIX for "calculations don't happen when I click Calculate":
#
# The `frontend` Deployment only serves static files - its image has NO
# reverse-proxy rules, so reaching the app through the bare `frontend` Service
# leaves every /api/* call with nowhere to go.
#
# This runs the project's own `calcu-nginx` image (built from nginx/, with
# nginx/nginx.conf baked in) as a NodePort gateway. Its upstream names already
# match the Kubernetes Service names (frontend:80, calculator-engine:5001,
# history-service:5003), so the exact same config works in Compose and here -
# no ConfigMap copy to keep in sync.
#
# Access the app through THIS Service. It does not need an Ingress Controller;
# k8s/ingress.yaml still works as a second path once one is enabled.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: calcu
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: calcu-nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: calcu
spec:
  type: NodePort         # Reachable from outside the cluster without an Ingress Controller
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080     # http://<node-ip>:30080  — see README for the exact minikube command
