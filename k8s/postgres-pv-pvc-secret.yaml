# postgres-pv-pvc-secret.yaml
#
# This file sets up everything PostgreSQL needs before it can run:
# a Namespace to keep our app's resources grouped together, a Secret holding
# the database credentials, and a PersistentVolumeClaim (PVC) for storage
# that survives pod restarts.
#
# NOTE: This project intentionally avoids any cloud-specific storage (like
# AWS EBS). Instead, the PVC below asks for storage using whatever
# StorageClass is already the DEFAULT on your cluster - Minikube ships with
# "standard", K3s ships with "local-path", and MicroK8s ships with
# "microk8s-hostpath". Run `kubectl get storageclass` to see yours; there's
# usually no need to change anything.

apiVersion: v1
kind: Namespace
metadata:
  name: calcu          # All our app's Kubernetes resources live inside this namespace
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: calcu
type: Opaque
# "stringData" lets us write plain, human-readable text here - Kubernetes
# automatically Base64-encodes it for us when the Secret is created.
stringData:
  POSTGRES_USER: calcu_user
  POSTGRES_PASSWORD: calcu_pass
  POSTGRES_DB: calcu_db
  # The History Service reads this single connection string via SQLAlchemy
  DATABASE_URL: postgresql+psycopg2://calcu_user:calcu_pass@postgres:5432/calcu_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: calcu
spec:
  accessModes:
    - ReadWriteOnce      # Only one pod at a time can read/write this storage - fine for a single DB pod
  # No "storageClassName" is set here on purpose - Kubernetes will use
  # whichever StorageClass is marked as default on your cluster, which
  # automatically creates ("dynamically provisions") the actual disk for us.
  resources:
    requests:
      storage: 5Gi       # Ask for 5 Gigabytes of storage space
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: calcu
spec:
  serviceName: postgres   # StatefulSets need a "headless" Service (see below) to manage pod identity
  replicas: 1             # Only ONE database pod - running multiple needs special replication setup
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials   # Pulls in POSTGRES_USER / PASSWORD / DB / DATABASE_URL
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data   # Where Postgres stores its actual data files
              subPath: postgres
          resources:                          # Stops this one pod from using unlimited CPU/RAM
            requests:
              cpu: 250m                        # "m" = milliCPU. 250m = a quarter of one CPU core
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:                      # "Is this pod ready to accept traffic yet?"
            exec:
              command: ["pg_isready", "-U", "calcu_user", "-d", "calcu_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:                       # "Is this pod still alive, or should it be restarted?"
            exec:
              command: ["pg_isready", "-U", "calcu_user", "-d", "calcu_db"]
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc            # Uses the storage claim defined above
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: calcu
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # "None" makes this a headless Service, required for StatefulSets
