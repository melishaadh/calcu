apiVersion: v1
kind: Namespace
metadata:
  name: calcu
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: calcu
type: Opaque
stringData:
  POSTGRES_USER: calcu_user
  POSTGRES_PASSWORD: calcu_pass
  POSTGRES_DB: calcu_db
  DATABASE_URL: postgresql+psycopg2://calcu_user:calcu_pass@postgres:5432/calcu_db
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: calcu
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp2
  awsElasticBlockStore:
    volumeID: "REPLACE_WITH_EBS_VOLUME_ID"
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: calcu
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: calcu
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "calcu_user", "-d", "calcu_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "calcu_user", "-d", "calcu_db"]
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: calcu
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
