# deployments-and-services.yaml
#
# Each "Deployment" below tells Kubernetes: "keep this many copies (replicas)
# of this container running, and automatically replace any that crash."
# Each matching "Service" gives that group of pods a stable network name
# (e.g. "history-service") so other pods can reliably find them.
#
# NOTE ON PLACEHOLDERS: "DOCKERHUB_USERNAME_PLACEHOLDER" and
# "IMAGE_TAG_PLACEHOLDER" below get automatically replaced by the Jenkinsfile
# ("Update Image Tags" stage) right before every deployment. If you're
# applying this file manually (without Jenkins), replace them yourself first:
#   sed -i 's|DOCKERHUB_USERNAME_PLACEHOLDER|your-dockerhub-username|g; s|IMAGE_TAG_PLACEHOLDER|latest|g' k8s/deployments-and-services.yaml
#
# NOTE ON THE GATEWAY: Docker Compose uses our own "nginx" container as a
# gateway (see nginx/nginx.conf). In Kubernetes, the standard Nginx Ingress
# Controller (see ingress.yaml) plays that exact same role, so there is no
# separate "gateway" Deployment here.

