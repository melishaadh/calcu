# ingress.yaml
#
# An "Ingress" is the standard Kubernetes way to expose HTTP routes from
# outside the cluster to Services running inside it. This replaces the need
# for our own custom Nginx gateway container (used in Docker Compose) - the
# Nginx Ingress Controller does that exact same routing job for us here.
#
# IMPORTANT: This requires an Nginx Ingress Controller to already be installed
# in your cluster (not a cloud load balancer - this project runs entirely on
# local/on-prem clusters like Minikube, K3s, or MicroK8s). See README.md for
# the one-line command to enable it.
#
# We do NOT rewrite the URL paths - each request keeps its original path
# (e.g. "/api/calculate") exactly as-is when it reaches the backend Service,
# because our Flask apps expect to receive that exact path.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calcu-ingress
  namespace: calcu
spec:
  ingressClassName: nginx        # Tells Kubernetes to use the Nginx Ingress Controller
  rules:
    - http:
        paths:
          # Requests starting with /api/calculate -> calculator-engine Service
          - path: /api/calculate
            pathType: Prefix
            backend:
              service:
                name: calculator-engine
                port:
                  number: 5001

          # Requests starting with /api/history -> history-service Service
          - path: /api/history
            pathType: Prefix
            backend:
              service:
                name: history-service
                port:
                  number: 5003

          # Everything else ("/", plus style.css and app.js) -> frontend Service.
          # This rule MUST be listed last - the Ingress Controller matches paths
          # in order, and "/" would otherwise catch every request before the
          # more specific rules above got a chance to match.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
