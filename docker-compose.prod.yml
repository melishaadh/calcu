# docker-compose.prod.yml — EC2 / production overrides.
#
# Layer this on top of the base file (this bypasses docker-compose.override.yml,
# so none of the local-dev conveniences leak onto the server):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Changes vs. the base file:
#   * restart policy -> "always" (survives a Docker daemon restart / EC2 reboot)
#   * log rotation on every container, so a long-running instance with a small
#     root volume never fills up with JSON logs
#
# Postgres already publishes no host port in the base file, so nothing
# DB-related is exposed on the instance. Set HTTP_PORT=80 in .env.

services:
  postgres:
    restart: always
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  history-service:
    restart: always
    logging: *default-logging

  calculator-engine:
    restart: always
    logging: *default-logging

  frontend:
    restart: always
    logging: *default-logging

  nginx:
    restart: always
    logging: *default-logging
