name: CI/CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::734320146457:role/calcu-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/calculator-backend:$IMAGE_TAG -t $ECR_REGISTRY/calculator-backend:latest ./backend
          docker push $ECR_REGISTRY/calculator-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/calculator-backend:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/calculator-frontend:$IMAGE_TAG -t $ECR_REGISTRY/calculator-frontend:latest ./frontend
          docker push $ECR_REGISTRY/calculator-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/calculator-frontend:latest
