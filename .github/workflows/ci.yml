# .github/workflows/ci.yml
#
# This is our Continuous Integration (CI) pipeline. GitHub Actions runs this
# file automatically every time someone pushes to "main" or opens a Pull Request.
#
# What it does, step by step:
#   1. Runs our Python unit tests for all three backend services
#   2. Logs into Docker Hub
#   3. Builds a Docker image for every microservice
#   4. Scans each image for security vulnerabilities using Trivy
#   5. Pushes the images to Docker Hub (only on a real push to "main")
#   6. Sends a Slack message saying whether it all worked or not
#
# SECURITY NOTE: This file references secrets.DOCKERHUB_USERNAME,
# secrets.DOCKERHUB_TOKEN, and secrets.SLACK_WEBHOOK_URL instead of writing
# the real values directly in this file. That's on purpose - anything typed
# into a workflow file gets committed to Git and can be read by anyone with
# access to the repository. See README.md for exactly where to paste your
# real values (GitHub repo Settings -> Secrets and variables -> Actions).

name: CI

on:
  push:
    branches: [main]        # Runs when code is pushed directly to "main"
  pull_request:
    branches: [main]        # Also runs on every Pull Request targeting "main"

env:
  # Builds an image name prefix like "yourname/calcu-scientific-engine"
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/calcu

jobs:
  # ==============================================================
  # JOB 1: Run unit tests for every backend service
  # "strategy: matrix" runs this job once per service listed, in parallel.
  # ==============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [scientific-engine, financial-engine, history-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        run: pytest -v

  # ==============================================================
  # JOB 2: Build, scan, and push a Docker image for every service
  # Only runs on an actual push to "main" (not on Pull Requests), and only
  # after every test above has passed.
  # ==============================================================
  build-scan-push:
    name: Build, Scan & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - name: scientific-engine
            context: services/scientific-engine
          - name: financial-engine
            context: services/financial-engine
          - name: history-service
            context: services/history-service
          - name: frontend
            context: frontend
          - name: nginx
            context: nginx
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Log in to Docker Hub using secrets stored in GitHub
      # (Set these in: Repo Settings -> Secrets and variables -> Actions)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image, tagged with both the exact commit SHA (for
      # traceability, so Jenkins can deploy an exact known-good version
      # later) and "latest".
      - name: Build Docker image
        env:
          REPO: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REPO:$IMAGE_TAG -t $REPO:latest ${{ matrix.service.context }}

      # Trivy is a free, open-source vulnerability scanner from Aqua Security.
      # "exit-code: 1" makes the build FAIL if a CRITICAL or HIGH vulnerability
      # with a known fix is found - remove/relax this once you're comfortable.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Push both tags to Docker Hub - only reached if tests + the scan passed
      - name: Push image to Docker Hub
        if: success()
        env:
          REPO: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REPO:$IMAGE_TAG
          docker push $REPO:latest

  # ==============================================================
  # JOB 3: Always tell the team what happened on Slack, win or lose
  # ==============================================================
  notify:
    name: Slack Notification
    needs: [test, build-scan-push]
    if: always()   # Runs even if an earlier job failed
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "state=FAILURE" >> "$GITHUB_OUTPUT"
            echo "color=#FF0000" >> "$GITHUB_OUTPUT"
          else
            echo "state=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "color=#36A64F" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {
            "attachments": [
              {
                "color": "${{ steps.status.outputs.color }}",
                "title": "CI ${{ steps.status.outputs.state }}: calcu",
                "text": "*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* \`${{ github.sha }}\`\n*Author:* ${{ github.actor }}\n*Message:* ${{ github.event.head_commit.message }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"
